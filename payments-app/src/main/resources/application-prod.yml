server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: payments-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/mydb?TimeZone=UTC
    username: sa

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC


payment:
  security:
    iam:
      enabled: true
      issuer: auth-service
      audience: payment-service
      ssl-enabled: true
      ssl-private-key-path: classpath:certs/private-key-pkcs8.pem
      ssl-certificate-path: classpath:certs/public-key.pem
      key-id: payment-service-key
      token-expiration-ms: 3600000
      validate-issuer: true
      validate-audience: true

    audit:
      enabled: true
      excluded-paths:
        - "/auth/**"
        - "/users/**"
        - "/h2-console/**"
        - "/error"
        - "/swagger-ui/**"
        - "/swagger-ui.html"
        - "/api-docs/**"
        - "/actuator/**"
        - "/health"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    displayRequestDuration: true

logging:
  external:
    body-enabled: true